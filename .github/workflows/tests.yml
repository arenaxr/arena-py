# Runs the unit test suite on every pull request and on pushes to master.
name: tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  unittest:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # setup.py declares python_requires='>=3.11', so test the supported floor.
          python-version: "3.11"
      - name: Install arena-py and its dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover tests
