# Runs the unit test suite on every pull request and on pushes to master.
name: tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  unittest:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # setup.py declares python_requires='>=3.11', so test the supported floor.
          python-version: "3.11"
      - name: Install arena-py and its dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover tests
